# Foundry 配置（与 Hardhat 3 共存）
# 用法：
#   forge test          # 运行 Solidity 测试（test/*.t.sol）
#   forge snapshot      # 生成 .gas-snapshot
# 注意：src 指向 contracts/（Hardhat 源码目录），test 指向 test/（与 TS 测试共存，forge 只认 *.t.sol）
[profile.default]
src = "contracts"
test = "test"
out = "forge-out"
libs = ["node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
verbosity = 1

# 依赖从 node_modules 借用（本项目未用 forge install 安装独立 lib）
remappings = [
    "forge-std/=node_modules/forge-std/src/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@chainlink/=node_modules/@chainlink/",
]
